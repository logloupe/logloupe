[package]
name = "logloupe-app"
description = "Logloupe desktop app."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "logloupe-app"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
logloupe-core = { path = "../../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[features]
# On by default so a plain `cargo build` embeds the built frontend. `pnpm tauri
# dev` turns it off to load the Vite dev server instead.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

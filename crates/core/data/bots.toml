bots = [
  { key = "claudebot", name = "ClaudeBot", kind = "ai-training", ua_match = ["claudebot"] },
  { key = "claude-searchbot", name = "Claude-SearchBot", kind = "ai-search", ua_match = ["claude-searchbot"] },

# Operators below publish no list in the supported shape (or none that could
# be confirmed), so their bots are `unverifiable` until reverse DNS is wired in.

[[operator]]
key = "amazon"
name = "Amazon"
rdns = ["crawl.amazonbot.amazon"]
bots = [
  { key = "amazonbot", name = "Amazonbot", kind = "ai-training", ua_match = ["amazonbot"] },
]

# Meta publishes no JSON list. Its crawler documentation says to verify against
# the routes its network (AS32934) announces, from the RADB routing registry.
[[operator]]
key = "meta"
name = "Meta"
min_prefixes = 50
range_urls = ["whois://whois.radb.net/-i origin AS32934"]
bots = [
  { key = "meta-externalagent", name = "Meta-ExternalAgent", kind = "ai-training", ua_match = ["meta-externalagent"] },
  { key = "meta-externalfetcher", name = "Meta-ExternalFetcher", kind = "ai-user", ua_match = ["meta-externalfetcher"] },
  { key = "meta-webindexer", name = "Meta-WebIndexer", kind = "ai-search", ua_match = ["meta-webindexer"] },
  { key = "facebookexternalhit", name = "FacebookExternalHit", kind = "social", ua_match = ["facebookexternalhit"] },
  { key = "facebookbot", name = "FacebookBot", kind = "ai-training", ua_match = ["facebookbot"] },
]


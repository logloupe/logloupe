# Bot registry. Copy this file to <data-dir>/bots.toml to edit it.
#
# Verification is done per operator: all of an operator's published lists are
# merged, so a GPTBot user agent arriving from a ChatGPT-User address is still
# verified. The bot's name and kind come from the user agent.
#
# ua_match: case-insensitive substrings. Operators and bots are checked in file
#           order and the first match wins, so put specific names first.
# kind:     search | ai-training | ai-search | ai-user | seo-tool | monitor | social | other
# range_urls: published lists in the shape
#           {"prefixes": [{"ipv4Prefix": "..."}, {"ipv6Prefix": "..."}]}
#           or whois://<server>/<query> for the routes a network announces
# min_prefixes: a fetched set with fewer prefixes than this is rejected.
# extra_ranges: networks registered to the operator that its lists leave out.
# rdns:     forward-confirmed reverse DNS suffixes (not used yet).

[[operator]]
key = "google"
name = "Google"
min_prefixes = 20
range_urls = ["https://developers.google.com/static/crawling/ipranges/common-crawlers.json"]
rdns = ["googlebot.com", "google.com"]
bots = [
  { key = "googlebot", name = "Googlebot", kind = "search", ua_match = ["googlebot"] },
  { key = "googleother", name = "GoogleOther", kind = "other", ua_match = ["googleother"] },
  { key = "google-cloudvertexbot", name = "Google-CloudVertexBot", kind = "ai-training", ua_match = ["google-cloudvertexbot"] },
]

# Google's other agents crawl from the special-crawler and user-triggered
# lists. They are checked against all of Google's lists, never the common list
# alone, or they would be wrongly flagged as fake.
[[operator]]
key = "google-other"
name = "Google (special and user-triggered)"
min_prefixes = 20
range_urls = [
  "https://developers.google.com/static/crawling/ipranges/special-crawlers.json",
  "https://developers.google.com/static/crawling/ipranges/user-triggered-fetchers.json",
  "https://developers.google.com/static/crawling/ipranges/user-triggered-fetchers-google.json",
  "https://developers.google.com/static/crawling/ipranges/common-crawlers.json",
]
rdns = ["google.com", "googleusercontent.com"]
bots = [
  { key = "adsbot-google", name = "AdsBot-Google", kind = "other", ua_match = ["adsbot-google"] },
  { key = "storebot-google", name = "Storebot-Google", kind = "search", ua_match = ["storebot-google"] },
  { key = "mediapartners-google", name = "Mediapartners-Google", kind = "other", ua_match = ["mediapartners-google"] },
  { key = "google-inspectiontool", name = "Google-InspectionTool", kind = "search", ua_match = ["google-inspectiontool"] },
  { key = "google-site-verification", name = "Google-Site-Verification", kind = "other", ua_match = ["google-site-verification"] },
  { key = "feedfetcher-google", name = "FeedFetcher-Google", kind = "other", ua_match = ["feedfetcher-google"] },
  { key = "google-read-aloud", name = "Google-Read-Aloud", kind = "other", ua_match = ["google-read-aloud"] },
  { key = "apis-google", name = "APIs-Google", kind = "other", ua_match = ["apis-google"] },
]


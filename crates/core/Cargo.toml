[package]
name = "loga-core"
description = "Log analyser engine: parse, enrich, store, report."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
directories = "6.0.0"
duckdb = { version = "1.20000.2", features = ["bundled"] }
flate2 = "1.1.11"
maxminddb = "0.33.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
ureq = "3.5.2"

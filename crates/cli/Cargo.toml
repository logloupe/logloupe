[package]
name = "logloupe"
description = "Logloupe command-line interface."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "logloupe"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
logloupe-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lint and test (Linux)
            os: ubuntu-latest
            lint: true
          - name: test (Windows)
            os: windows-latest
          - name: test (macOS)
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The desktop app links against GTK and WebKit on Linux.
      - name: Install Linux libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: crates/app/pnpm-lock.yaml

      # The app crate embeds the built frontend at compile time, so it has to
      # exist before any cargo command touches the workspace. This step also
      # type-checks the frontend.
      - name: Build the frontend
        working-directory: crates/app
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Bundled DuckDB takes a long time to compile; the cache makes later runs quick.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: matrix.lint
        run: cargo fmt --all --check
      - name: Clippy
        if: matrix.lint
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      # Release profile so tests share one DuckDB build with the binaries.
      - name: Test
        run: cargo test --workspace --release
